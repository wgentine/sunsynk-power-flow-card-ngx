<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=960" />
  <title>Sunsynk power-flow — design mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    body[data-theme="dark"] { background: #0b0c0f; color: #e8eaed; }
    body[data-theme="light"] { background: #eef1f6; color: #14181f; }

    .card { width: 920px; height: 520px; position: relative; }
    body[data-theme="dark"][data-dir="a"] .card {
      background: linear-gradient(165deg, #14161c 0%, #0f1115 55%, #12151b 100%);
      border-radius: 24px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 24px 80px rgba(0,0,0,0.55);
    }
    body[data-theme="light"][data-dir="a"] .card {
      background: linear-gradient(180deg, #fff 0%, #f6f8fb 100%);
      border-radius: 24px;
      box-shadow: 0 0 0 1px rgba(15,17,21,0.06), 0 20px 60px rgba(15,17,21,0.08);
    }
    body[data-theme="dark"][data-dir="b"] .card {
      background: #0f1115;
      border-radius: 12px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    }
    body[data-theme="light"][data-dir="b"] .card {
      background: #f8f9fc;
      border-radius: 12px;
      box-shadow: inset 0 0 0 1px rgba(15,17,21,0.08);
    }
    svg.mock { width: 100%; height: 100%; display: block; }
    .flow-track { fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .flow-active { fill: none; stroke-linecap: butt; stroke-linejoin: round; }
    .flow-bus { stroke-linecap: round; }
    body[data-dir="a"] .flow-track { stroke-width: 3; opacity: 0.14; }
    body[data-dir="a"] .flow-active { stroke-width: 2.5; opacity: 0.88; }
    body[data-dir="b"] .flow-track { stroke-width: 1; opacity: 0.22; }
    body[data-dir="b"] .flow-active { stroke-width: 0.75; opacity: 0.7; }
    body[data-dir="a"] .dot-glow { filter: url(#dotGlow); }
    @keyframes pulse-ring { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.65; } }
    body[data-dir="a"] .node-ring-outer { animation: pulse-ring 4s ease-in-out infinite; }
  </style>
</head>
<body data-dir="a" data-theme="dark">
  <div class="card"><svg class="mock" viewBox="0 0 940 520" id="diagram"></svg></div>
  <script>
    const dir = new URLSearchParams(location.search).get('dir') === 'b' ? 'b' : 'a';
    const theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark';
    document.body.dataset.dir = dir;
    document.body.dataset.theme = theme;

    const ICONS = {
      solar: 'M11.45,2V5.55L15,3.77L11.45,2M10.45,8L8,10.46L11.75,11.71L10.45,8M2,11.45L3.77,15L5.55,11.45H2M10,2H2V10C2.57,10.17 3.17,10.25 3.77,10.25C7.35,10.26 10.26,7.35 10.27,3.75C10.26,3.16 10.17,2.57 10,2M17,22V16H14L19,7V13H22L17,22Z',
      grid: 'M8.28,5.45L6.5,4.55L7.76,2H16.23L17.5,4.55L15.72,5.44L15,4H9L8.28,5.45M18.62,8H14.09L13.3,5H10.7L9.91,8H5.38L4.1,10.55L5.89,11.44L6.62,10H17.38L18.1,11.45L19.89,10.56L18.62,8M17.77,22H15.7L15.46,21.1L12,15.9L8.53,21.1L8.3,22H6.23L9.12,11H11.19L10.83,12.35L12,14.1L13.16,12.35L12.81,11H14.88L17.77,22Z',
      home: 'M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z',
      homeOut: 'M12 5.69L17 10.19V18H15V12H9V18H7V10.19L12 5.69M12 3L2 12H5V20H11V14H13V20H19V12H22',
      inv: 'M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z',
      battery: 'M16.67,4H15V2H9V4H7.33A1.33,1.33 0 0,0 6,5.33V20.67C6,21.4 6.6,22 7.33,22H16.67A1.33,1.33 0 0,0 18,20.67V5.33C18,4.6 17.4,4 16.67,4M11,20V14.5H9L13,7V12.5H15',
      ev: 'M19.77,7.23L16.06,3.5L15,4.56L17.11,6.67C16.17,7.03 15.5,7.93 15.5,9A2.5,2.5 0 0,0 18,11.5M8,18V13.5H6L10,6V11H12L8,18Z',
      hw: 'M8 2C6.89 2 6 2.89 6 4V16C6 17.11 6.89 18 8 18H9V20H6V22H9C10.11 22 11 21.11 11 20V18H13V20C13 21.11 13.89 22 15 22H18V20H15V18H16C17.11 18 18 17.11 18 16V4C18 2.89 17.11 2 16 2H8M12 4.97A2 2 0 0 1 14 6.97A2 2 0 0 1 12 8.97A2 2 0 0 1 10 6.97A2 2 0 0 1 12 4.97M10 14.5H14V16H10V14.5Z',
      kitchen: 'M6,14H8L11,17H9L6,14M20,6H4V10H20V6M4,19H20V12H4V19M13,14H15L18,17H16L13,14Z',
      office: 'M3 6H21C21.55 6 22 6.45 22 7C22 7.55 21.55 8 21 8V19H19V17H15V19H13V8H5V19H3V8C2.45 8 2 7.55 2 7C2 6.45 2.45 6 3 6Z',
      pool: 'M2,15C3.67,14.25 5.33,13.5 7,13.17V5A3,3 0 0,1 10,2C11.31,2 12.42,2.83 12.83,4H10A1,1 0 0,0 9,5V6H14V5A3,3 0 0,1 17,2C18.31,2 19.42,2.83 19.83,4H17A1,1 0 0,0 16,5V14.94C18,14.62 20,13 22,13V15M14,8H9V10H14V8',
      shed: 'M12 3L2 12H5V20H19V12H22L12 3M11.5 18V14H9L12.5 7V11H15L11.5 18Z',
      garage: 'M19,20H17V11H7V20H5V9L12,5L19,9V20M8,12H16V14H8V12',
      shop: 'M13.78 15.3L19.78 21.3L21.89 19.14L15.89 13.14L13.78 15.3M17.5 10.1L4.97 21.25L2.86 19.14L10.27 11.74L17.5 10.1Z',
    };

    const pal = theme === 'dark'
      ? {
          solar: '#f5a524', battery: '#3ecf8e', grid: dir === 'b' ? '#a78bfa' : '#5b9fd4',
          load: '#4ecdc4', inv: '#9aa3b2', text: '#e8eaed', muted: '#8b939e',
          surface: dir === 'a' ? 'rgba(255,255,255,0.08)' : 'transparent',
          surfaceHi: dir === 'a' ? 'rgba(255,255,255,0.12)' : 'transparent',
          gridLine: dir === 'b' ? 'rgba(255,255,255,0.04)' : 'transparent',
        }
      : {
          solar: '#d48806', battery: '#16a34a', grid: dir === 'b' ? '#7c5cff' : '#3b82c4',
          load: '#0d9488', inv: '#64748b', text: '#14181f', muted: '#64748b',
          surface: dir === 'a' ? 'rgba(255,255,255,0.92)' : 'transparent',
          surfaceHi: dir === 'a' ? '#ffffff' : 'transparent',
          gridLine: dir === 'b' ? 'rgba(15,17,21,0.06)' : 'transparent',
        };

    const INV = { x: 388, y: 238, r: 40 };
    const HOME = { x: 468, y: 238, r: 26 };
    const BUS_Y = 198;
    const BUS_X0 = 558;
    const BUS_X1 = 828;
    const MERGE_X = 348;
    const PV_CORRIDOR_Y = 172;
    const COL0 = 588;
    const COL_SP = 88;

    const LOADS = [
      { id: 1, cx: COL0, cy: 112, w: 350, icon: 'ev', name: 'EV charger' },
      { id: 2, cx: COL0 + COL_SP, cy: 112, w: 400, icon: 'hw', name: 'Hot water' },
      { id: 5, cx: COL0 + COL_SP * 2, cy: 112, w: 550, icon: 'pool', name: 'Pool' },
      { id: 7, cx: COL0 + COL_SP * 3, cy: 112, w: 650, icon: 'garage', name: 'Garage' },
      { id: 3, cx: COL0, cy: 284, w: 450, icon: 'kitchen', name: 'Kitchen' },
      { id: 4, cx: COL0 + COL_SP, cy: 284, w: 500, icon: 'office', name: 'Office' },
      { id: 6, cx: COL0 + COL_SP * 2, cy: 284, w: 600, icon: 'shed', name: 'Shed' },
      { id: 8, cx: COL0 + COL_SP * 3, cy: 284, w: 700, icon: 'shop', name: 'Workshop' },
    ];
    const LR = 28;
    const SOC = 0.75;
    const GRID = { cx: 92, cy: 228, r: 34 };
    const GRIDCT = { cx: 168, cy: 228, r: 22 };
    const NONESS = { cx: 92, cy: 318, r: 28 };
    const socR = 36;
    const BATT = { cx: INV.x, cy: 388, r: socR + 2 };
    const PV1 = { cx: 268, cy: 58, r: 34 };
    const PV2 = { cx: 388, cy: 58, r: 34 };
    const textBoxes = [];

    const nodeFill = dir === 'a'
      ? (theme === 'dark' ? '#181b22' : '#ffffff')
      : 'transparent';

    /** Visible outer edge of node circle (stroke sits on radius). */
    function outerR(r, glow = false) {
      return r + (dir === 'a' ? 2 + (glow ? 5 : 0) : 0);
    }

    /** Boundary point on ring when leaving node toward (tx, ty). */
    function ringOut(cx, cy, r, tx, ty, glow = false) {
      const R = outerR(r, glow);
      const dx = tx - cx;
      const dy = ty - cy;
      const len = Math.hypot(dx, dy) || 1;
      return { x: cx + (dx / len) * R, y: cy + (dy / len) * R };
    }

    /** Boundary point where a line from (fx, fy) meets the ring (approach from outside). */
    function ringIn(cx, cy, r, fx, fy, glow = false) {
      const R = outerR(r, glow);
      const dx = cx - fx;
      const dy = cy - fy;
      const len = Math.hypot(dx, dy) || 1;
      return { x: cx - (dx / len) * R, y: cy - (dy / len) * R };
    }

    const MASK_NODES = [
      { ...PV1, glow: true },
      { ...PV2, glow: true },
      GRID,
      { cx: INV.x, cy: INV.y, r: INV.r, glow: true },
      { cx: HOME.x, cy: HOME.y, r: HOME.r, glow: true },
      BATT,
      NONESS,
      GRIDCT,
      ...LOADS.map((l) => ({ cx: l.cx, cy: l.cy, r: LR, glow: false })),
    ];
    const B_HALO = 26;

    function iconSvg(key, x, y, size, color, outline) {
      const s = size / 24;
      const d = ICONS[key];
      if (outline) {
        return `<g transform="translate(${x},${y}) scale(${s})"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linejoin="round"/></g>`;
      }
      return `<g transform="translate(${x},${y}) scale(${s})"><path d="${d}" fill="${color}"/></g>`;
    }

    function flow(d, color, id, dur = '2.4s', bus = false) {
      const dotR = dir === 'a' ? 4 : 2.5;
      const cap = bus ? 'flow-bus' : '';
      const dot = dir === 'a' || id.startsWith('flow-')
        ? `<circle class="dot-glow" r="${dotR}" fill="${color}"><animateMotion dur="${dur}" repeatCount="indefinite" rotate="auto"><mpath href="#${id}"/></animateMotion></circle>`
        : '';
      return `<path class="flow-track ${cap}" d="${d}" stroke="${color}"/>
        <path class="flow-active ${cap}" id="${id}" d="${d}" stroke="${color}"/>${dot}`;
    }

    function trackText(x, y, w, h, id) {
      textBoxes.push({ x, y, w, h, id });
    }

    function statChip(x, y, w, h, lines) {
      trackText(x, y, w, h, 'stat-chip');
      const fill = dir === 'a' ? pal.surfaceHi : pal.surface || (theme === 'dark' ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.03)');
      const stroke = dir === 'a' ? 'none' : pal.grid;
      const sw = dir === 'a' ? 0 : 0.6;
      return `<g transform="translate(${x},${y})">
        <rect width="${w}" height="${h}" rx="10" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-opacity="0.35"/>
        ${lines.map((ln, i) => `<text x="12" y="${16 + i * 14}" fill="${i === 0 ? pal.text : pal.muted}" font-size="${i === 0 ? 11 : 9}" font-weight="${i === 0 ? 600 : 500}">${ln}</text>`).join('')}
      </g>`;
    }

    function pill(x, y, value, unit, label, accent, anchor = 'middle') {
      const w = Math.max(58, value.length * 7 + 28);
      const ox = anchor === 'middle' ? x - w / 2 : anchor === 'start' ? x : x - w;
      trackText(ox, y, w, 26, label || value);
      const fill = dir === 'a' ? pal.surfaceHi : 'transparent';
      const stroke = dir === 'b' ? accent : 'none';
      return `<g transform="translate(${ox},${y})">
        <rect width="${w}" height="26" rx="7" fill="${fill}" stroke="${stroke}" stroke-width="${dir === 'b' ? 0.6 : 0}" stroke-opacity="0.3"/>
        <text x="${w / 2}" y="11" text-anchor="middle" fill="${pal.text}" font-size="11" font-weight="600" font-variant-numeric="tabular-nums">${value}<tspan fill="${pal.muted}" font-size="9" font-weight="500"> ${unit}</tspan></text>
        ${label ? `<text x="${w / 2}" y="22" text-anchor="middle" fill="${pal.muted}" font-size="9">${label}</text>` : ''}
      </g>`;
    }

    function luminousNode(cx, cy, r, color, icon, id) {
      const is = 22;
      return `<g id="${id}">
        <circle class="node-ring-outer" cx="${cx}" cy="${cy}" r="${r + 5}" fill="none" stroke="${color}" stroke-width="1" stroke-opacity="0.25"/>
        <circle cx="${cx}" cy="${cy}" r="${r + 3}" fill="${nodeFill}" stroke="none"/>
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="${nodeFill}" stroke="${color}" stroke-width="2" stroke-opacity="0.5"/>
        ${iconSvg(icon, cx - is / 2, cy - is / 2, is, color, false)}
      </g>`;
    }

    function floatTile(cx, cy, color, icon, value, label, id, textDy = 0) {
      const is = 20;
      return `<g id="${id}">
        <line x1="${cx - 28}" y1="${cy + 22 + textDy}" x2="${cx + 28}" y2="${cy + 22 + textDy}" stroke="${pal.gridLine === 'transparent' ? color : pal.gridLine}" stroke-width="0.5"/>
        ${iconSvg(icon, cx - is / 2, cy - is / 2 - 4, is, color, true)}
        <text x="${cx}" y="${cy + 18 + textDy}" text-anchor="middle" fill="${pal.text}" font-size="11" font-weight="600" font-variant-numeric="tabular-nums">${value}</text>
        <text x="${cx}" y="${cy + 32 + textDy}" text-anchor="middle" fill="${pal.muted}" font-size="9">${label}</text>
      </g>`;
    }

    function loadNode(l) {
      const topRow = l.cy < BUS_Y;
      if (dir === 'b') {
        const textDy = topRow ? -40 : 0;
        trackText(l.cx - 36, l.cy + textDy + 26, 72, 12, l.name);
        trackText(l.cx - 28, l.cy + textDy + 8, 56, 14, `${l.w} W`);
        return floatTile(l.cx, l.cy, pal.load, l.icon, `${l.w} W`, l.name, `load-${l.id}`, textDy);
      }
      const is = 18;
      const nameY = topRow ? l.cy - LR - 8 : l.cy + LR + 28;
      const wattY = topRow ? l.cy - LR - 22 : l.cy + LR + 14;
      const nameW = l.name.length * 5.2 + 8;
      const wattW = String(l.w).length * 7 + 24;
      trackText(l.cx - nameW / 2, nameY - 11, nameW, 12, l.name);
      trackText(l.cx - wattW / 2, wattY - 12, wattW, 14, `${l.w} W`);
      return `<g id="load-${l.id}">
        <circle cx="${l.cx}" cy="${l.cy}" r="${LR + 2}" fill="${nodeFill}" stroke="none"/>
        <circle cx="${l.cx}" cy="${l.cy}" r="${LR}" fill="${nodeFill}" stroke="${pal.load}" stroke-width="2" stroke-opacity="0.55"/>
        ${iconSvg(l.icon, l.cx - is / 2, l.cy - is / 2, is, pal.load, false)}
        <text x="${l.cx}" y="${wattY}" text-anchor="middle" fill="${pal.text}" font-size="11" font-weight="600" font-variant-numeric="tabular-nums">${l.w} W</text>
        <text x="${l.cx}" y="${nameY}" text-anchor="middle" fill="${pal.muted}" font-size="9">${l.name}</text>
      </g>`;
    }

    const flows = [];
    const flowIds = [];

    function addFlow(d, color, id, dur = '2.4s', bus = false) {
      flows.push(flow(d, color, id, dur, bus));
      flowIds.push(id);
    }

    // PV: bottom of ring → corridor below pills → trunk → inverter top ring
    const pv1Out = ringOut(PV1.cx, PV1.cy, PV1.r, PV1.cx, PV_CORRIDOR_Y);
    const pv2Out = ringOut(PV2.cx, PV2.cy, PV2.r, PV2.cx, PV_CORRIDOR_Y);
    addFlow(
      `M ${pv1Out.x} ${pv1Out.y} L ${pv1Out.x} ${PV_CORRIDOR_Y} L ${MERGE_X} ${PV_CORRIDOR_Y}`,
      pal.solar, 'flow-pv1', '2.2s',
    );
    addFlow(
      `M ${pv2Out.x} ${pv2Out.y} L ${pv2Out.x} ${PV_CORRIDOR_Y} L ${MERGE_X} ${PV_CORRIDOR_Y}`,
      pal.solar, 'flow-pv2', '2.5s',
    );
    const invTopIn = ringIn(INV.x, INV.y, INV.r, MERGE_X, PV_CORRIDOR_Y + 120);
    addFlow(
      `M ${MERGE_X} ${PV_CORRIDOR_Y} L ${MERGE_X} ${invTopIn.y} L ${invTopIn.x} ${invTopIn.y}`,
      pal.solar, 'flow-pv-trunk', '2s',
    );

    // Grid → grid CT → inverter (inline, no diagonals)
    const gOut = ringOut(GRID.cx, GRID.cy, GRID.r, GRIDCT.cx, GRID.cy);
    const ctIn = ringIn(GRIDCT.cx, GRIDCT.cy, GRIDCT.r, GRID.cx, GRID.cy);
    addFlow(`M ${gOut.x} ${gOut.y} L ${ctIn.x} ${ctIn.y}`, pal.grid, 'flow-grid-ct', '3.1s');
    const ctOut = ringOut(GRIDCT.cx, GRIDCT.cy, GRIDCT.r, INV.x, INV.y);
    const invGridIn = ringIn(INV.x, INV.y, INV.r, GRIDCT.cx, GRIDCT.cy);
    const midG = (ctOut.x + invGridIn.x) / 2;
    addFlow(
      `M ${ctOut.x} ${ctOut.y} C ${midG} ${ctOut.y} ${midG} ${invGridIn.y} ${invGridIn.x} ${invGridIn.y}`,
      pal.grid, 'flow-grid-inv', '3s',
    );

    // Non-essential: short drop under grid node
    const gDown = ringOut(GRID.cx, GRID.cy, GRID.r, NONESS.cx, NONESS.cy);
    const neIn = ringIn(NONESS.cx, NONESS.cy, NONESS.r, GRID.cx, GRID.cy);
    addFlow(`M ${gDown.x} ${gDown.y} L ${neIn.x} ${neIn.y}`, pal.grid, 'flow-noness', '2.9s');

    const batLaneX = INV.x - 52;
    const invBatOut = ringOut(INV.x, INV.y, INV.r, batLaneX, BATT.cy);
    const batTopIn = ringIn(BATT.cx, BATT.cy, BATT.r, batLaneX, INV.y);
    addFlow(
      `M ${invBatOut.x} ${invBatOut.y} L ${batLaneX} ${invBatOut.y} L ${batLaneX} ${batTopIn.y} L ${batTopIn.x} ${batTopIn.y}`,
      pal.battery, 'flow-bat', '2.6s',
    );

    const invHomeOut = ringOut(INV.x, INV.y, INV.r, HOME.cx, HOME.cy);
    const homeInvIn = ringIn(HOME.x, HOME.y, HOME.r, INV.x, INV.y);
    addFlow(`M ${invHomeOut.x} ${invHomeOut.y} L ${homeInvIn.x} ${homeInvIn.y}`, pal.load, 'flow-inv-home', '2s');

    const homeBusOut = ringOut(HOME.x, HOME.y, HOME.r, BUS_X0, BUS_Y);
    addFlow(
      `M ${homeBusOut.x} ${homeBusOut.y} C ${homeBusOut.x + 44} ${homeBusOut.y} ${BUS_X0 - 48} ${(HOME.y + BUS_Y) / 2} ${BUS_X0} ${BUS_Y}`,
      pal.load, 'flow-home-bus', '2.1s',
    );

    addFlow(`M ${BUS_X0} ${BUS_Y} L ${BUS_X1} ${BUS_Y}`, pal.load, 'flow-bus', '2.8s', true);

    LOADS.forEach((l) => {
      const tip = ringIn(l.cx, l.cy, LR, l.cx, BUS_Y);
      addFlow(`M ${l.cx} ${BUS_Y} L ${tip.x} ${tip.y}`, pal.load, `flow-L${l.id}`, `${1.4 + l.w / 900}s`);
    });
    const circ = 2 * Math.PI * socR;
    const dash = circ * SOC;

    let nodes = '';
    let labels = '';

    labels += statChip(20, 18, 108, 40, ['Autarky 70%', 'Ratio 100%']);

    if (dir === 'a') {
      nodes += luminousNode(PV1.cx, PV1.cy, PV1.r, pal.solar, 'solar', 'pv1');
      nodes += luminousNode(PV2.cx, PV2.cy, PV2.r, pal.solar, 'solar', 'pv2');
      labels += pill(PV1.cx + 52, PV1.cy - 12, '2.00', 'kW', 'PV 1', pal.solar, 'start');
      labels += pill(PV2.cx + 52, PV2.cy - 12, '1.50', 'kW', 'PV 2', pal.solar, 'start');
      labels += pill(MERGE_X + 54, 98, '3.50', 'kW', 'Solar total', pal.solar, 'start');
      nodes += luminousNode(GRID.cx, GRID.cy, GRID.r, pal.grid, 'grid', 'grid');
      nodes += luminousNode(GRIDCT.cx, GRIDCT.cy, GRIDCT.r, pal.grid, 'grid', 'gridct');
      labels += pill(GRID.cx, GRID.cy + GRID.r + 30, '100', 'W', 'Grid import', pal.grid);
      nodes += luminousNode(INV.x, INV.y, INV.r, pal.inv, 'inv', 'inv');
      labels += pill(INV.x, INV.y + INV.r + 38, '4.50', 'kW', 'Inverter', pal.inv);
      nodes += luminousNode(HOME.x, HOME.y, HOME.r, pal.load, 'home', 'home');
      nodes += `<g id="battery" transform="translate(${BATT.cx},${BATT.cy})">
        <circle r="${socR + 8}" fill="${nodeFill}" stroke="none"/>
        <circle r="${socR}" fill="${nodeFill}" stroke="none"/>
        <circle r="${socR}" fill="none" stroke="${pal.battery}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${dash} ${circ - dash}" transform="rotate(-90)"/>
        <text text-anchor="middle" y="-2" fill="${pal.text}" font-size="13" font-weight="700">${Math.round(SOC * 100)}%</text>
        <text text-anchor="middle" y="14" fill="${pal.muted}" font-size="9">Battery</text>
        <text text-anchor="middle" y="50" fill="${pal.battery}" font-size="11" font-weight="600">−500 W</text>
      </g>`;
      trackText(BATT.cx - 28, BATT.cy + 38, 56, 14, 'battery-w');
      nodes += luminousNode(NONESS.cx, NONESS.cy, NONESS.r, pal.grid, 'homeOut', 'noness');
      labels += pill(NONESS.cx, NONESS.cy + NONESS.r + 30, '−100', 'W', 'Non-essential', pal.grid);
      labels += pill(GRIDCT.cx, GRIDCT.cy + GRIDCT.r + 30, '0', 'W', 'Grid CT', pal.grid);
    } else {
      const gridBg = Array.from({ length: 24 }, (_, i) =>
        `<line x1="${i * 40}" y1="0" x2="${i * 40}" y2="520" stroke="${pal.gridLine}"/>`
      ).join('') + Array.from({ length: 14 }, (_, i) =>
        `<line x1="0" y1="${i * 40}" x2="940" y2="${i * 40}" stroke="${pal.gridLine}"/>`
      ).join('');
      nodes += `<g opacity="0.9">${gridBg}</g>`;
      nodes += floatTile(PV1.cx, PV1.cy, pal.solar, 'solar', '2.00 kW', 'PV 1', 'pv1');
      nodes += floatTile(PV2.cx, PV2.cy, pal.solar, 'solar', '1.50 kW', 'PV 2', 'pv2');
      labels += pill(MERGE_X + 54, 98, '3.50', 'kW', 'Solar Σ', pal.solar, 'start');
      nodes += floatTile(GRID.cx, GRID.cy, pal.grid, 'grid', '100 W', 'Grid', 'grid');
      nodes += floatTile(GRIDCT.cx, GRIDCT.cy, pal.grid, 'grid', '0 W', 'Grid CT', 'gridct');
      nodes += floatTile(INV.x, INV.y, pal.inv, 'inv', '4.50 kW', 'Inverter', 'inv');
      nodes += floatTile(HOME.x, HOME.y, pal.load, 'home', 'Essential', 'Home', 'home');
      nodes += floatTile(INV.x, BATT.cy, pal.battery, 'battery', `${Math.round(SOC * 100)}%`, 'Battery −500 W', 'bat');
      nodes += floatTile(NONESS.cx, NONESS.cy, pal.grid, 'homeOut', '−100 W', 'Non-essential', 'noness');
    }

    const loads = LOADS.map(loadNode).join('');

    const maskHoles = dir === 'a'
      ? MASK_NODES.map((n) => {
          const dotPad = dir === 'a' ? 5 : 3;
          return `<circle cx="${n.cx}" cy="${n.cy}" r="${outerR(n.r, n.glow) + dotPad}" fill="black"/>`;
        }).join('')
      : [
          ...MASK_NODES.map((n) => `<circle cx="${n.cx}" cy="${n.cy}" r="${B_HALO}" fill="black"/>`),
          ...LOADS.map((l) => `<circle cx="${l.cx}" cy="${l.cy}" r="${B_HALO}" fill="black"/>`),
        ].join('');

    document.getElementById('diagram').innerHTML = `
      <defs>
        <filter id="dotGlow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="2.2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <mask id="flow-ring-mask" maskUnits="userSpaceOnUse">
          <rect width="940" height="520" fill="white"/>
          ${maskHoles}
        </mask>
      </defs>
      <g id="layer-flows" mask="url(#flow-ring-mask)">${flows.join('')}</g>
      <g id="layer-labels">${labels}</g>
      <g id="layer-nodes">${nodes}</g>
      <g id="layer-loads">${loads}</g>`;
    document.getElementById('diagram').style.color = pal.text;

    window.__mockupQa = {
      textBoxes,
      flowIds,
      pad: 2,
    };
  </script>
</body>
</html>
