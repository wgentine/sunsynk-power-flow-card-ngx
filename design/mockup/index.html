<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=960" />
  <title>Sunsynk power-flow — design mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    body[data-theme="dark"] {
      background: #0b0c0f;
      color: #e8eaed;
    }
    body[data-theme="light"] {
      background: #eef1f6;
      color: #14181f;
    }
  body[data-dir="a"] { --card-radius: 24px; }
  body[data-dir="b"] { --card-radius: 16px; }

    .card {
      width: 920px;
      height: 520px;
      position: relative;
    }
    body[data-theme="dark"][data-dir="a"] .card {
      background: linear-gradient(165deg, #14161c 0%, #0f1115 55%, #12151b 100%);
      border-radius: var(--card-radius);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        0 24px 80px rgba(0,0,0,0.55);
    }
    body[data-theme="light"][data-dir="a"] .card {
      background: linear-gradient(180deg, #ffffff 0%, #f6f8fb 100%);
      border-radius: var(--card-radius);
      box-shadow:
        0 0 0 1px rgba(15,17,21,0.06),
        0 20px 60px rgba(15,17,21,0.08);
    }
    body[data-theme="dark"][data-dir="b"] .card {
      background: #0f1115;
      border-radius: var(--card-radius);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }
    body[data-theme="light"][data-dir="b"] .card {
      background: #fafbfc;
      border-radius: var(--card-radius);
      box-shadow: inset 0 0 0 1px rgba(15,17,21,0.1);
    }

    svg.mock {
      width: 100%;
      height: 100%;
      display: block;
    }
    .tabular { font-variant-numeric: tabular-nums; }
    .muted { opacity: 0.55; font-size: 10px; font-weight: 500; }
    .value { font-size: 13px; font-weight: 600; letter-spacing: -0.02em; }
    .label { font-size: 10px; font-weight: 500; fill: currentColor; opacity: 0.5; }

    .flow-track { fill: none; stroke-width: 3; opacity: 0.12; stroke-linecap: round; }
    body[data-dir="b"] .flow-track { stroke-width: 2; opacity: 0.18; }

    .flow-active { fill: none; stroke-width: 2.5; stroke-linecap: round; opacity: 0.85; }
    body[data-dir="b"] .flow-active { stroke-width: 1.5; opacity: 0.9; stroke-dasharray: none; }

    .dot-glow { filter: url(#dotGlow); }
    body[data-dir="b"] .dot-glow { filter: none; }

    @keyframes pulse-ring {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.65; }
    }
    body[data-dir="a"] .node-ring-outer { animation: pulse-ring 4s ease-in-out infinite; }
  </style>
</head>
<body data-dir="a" data-theme="dark">
  <div class="card" id="card">
    <svg class="mock" viewBox="0 0 920 520" id="diagram" aria-label="Power flow mockup"></svg>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const dir = params.get('dir') === 'b' ? 'b' : 'a';
    const theme = params.get('theme') === 'light' ? 'light' : 'dark';
    document.body.dataset.dir = dir;
    document.body.dataset.theme = theme;

    const ICONS = {
      solar: 'M11.45,2V5.55L15,3.77L11.45,2M10.45,8L8,10.46L11.75,11.71L10.45,8M2,11.45L3.77,15L5.55,11.45H2M10,2H2V10C2.57,10.17 3.17,10.25 3.77,10.25C7.35,10.26 10.26,7.35 10.27,3.75C10.26,3.16 10.17,2.57 10,2M17,22V16H14L19,7V13H22L17,22Z',
      grid: 'M8.28,5.45L6.5,4.55L7.76,2H16.23L17.5,4.55L15.72,5.44L15,4H9L8.28,5.45M18.62,8H14.09L13.3,5H10.7L9.91,8H5.38L4.1,10.55L5.89,11.44L6.62,10H17.38L18.1,11.45L19.89,10.56L18.62,8M17.77,22H15.7L15.46,21.1L12,15.9L8.53,21.1L8.3,22H6.23L9.12,11H11.19L10.83,12.35L12,14.1L13.16,12.35L12.81,11H14.88L17.77,22Z',
      home: 'M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z',
      homeOut: 'M12 5.69L17 10.19V18H15V12H9V18H7V10.19L12 5.69M12 3L2 12H5V20H11V14H13V20H19V12H22',
      inv: 'M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z',
      ev: 'M19.77,7.23L19.78,7.22L16.06,3.5L15,4.56L17.11,6.67C16.17,7.03 15.5,7.93 15.5,9A2.5,2.5 0 0,0 18,11.5C18.36,11.5 18.69,11.42 19,11.29V18.5A1,1 0 0,1 18,19.5A1,1 0 0,1 17,18.5V14A2,2 0 0,0 15,12H14V5A2,2 0 0,0 12,3H6A2,2 0 0,0 4,5V21H14V13.5H15.5V18.5A2.5,2.5 0 0,0 18,21A2.5,2.5 0 0,0 20.5,18.5V9C20.5,8.31 20.22,7.68 19.77,7.23M8,18V13.5H6L10,6V11H12L8,18Z',
      hw: 'M8 2C6.89 2 6 2.89 6 4V16C6 17.11 6.89 18 8 18H9V20H6V22H9C10.11 22 11 21.11 11 20V18H13V20C13 21.11 13.89 22 15 22H18V20H15V18H16C17.11 18 18 17.11 18 16V4C18 2.89 17.11 2 16 2H8M12 4.97A2 2 0 0 1 14 6.97A2 2 0 0 1 12 8.97A2 2 0 0 1 10 6.97A2 2 0 0 1 12 4.97M10 14.5H14V16H10V14.5Z',
      kitchen: 'M6,14H8L11,17H9L6,14M20,6H4V10H20V6M4,19H20V12H4V19M13,14H15L18,17H16L13,14Z',
      office: 'M3 6H21C21.55 6 22 6.45 22 7C22 7.55 21.55 8 21 8V19H19V17H15V19H13V8H5V19H3V8C2.45 8 2 7.55 2 7C2 6.45 2.45 6 3 6Z',
      pool: 'M2,15C3.67,14.25 5.33,13.5 7,13.17V5A3,3 0 0,1 10,2C11.31,2 12.42,2.83 12.83,4H10A1,1 0 0,0 9,5V6H14V5A3,3 0 0,1 17,2C18.31,2 19.42,2.83 19.83,4H17A1,1 0 0,0 16,5V14.94C18,14.62 20,13 22,13V15M14,8H9V10H14V8',
      shed: 'M12 3L2 12H5V20H19V12H22L12 3M11.5 18V14H9L12.5 7V11H15L11.5 18Z',
      garage: 'M19,20H17V11H7V20H5V9L12,5L19,9V20M8,12H16V14H8V12',
      shop: 'M13.78 15.3L19.78 21.3L21.89 19.14L15.89 13.14L13.78 15.3M17.5 10.1C17.11 10.1 16.69 10.05 16.36 9.91L4.97 21.25L2.86 19.14L10.27 11.74L8.5 9.96L7.78 10.66L6.33 9.25V12.11L5.63 12.81L2.11 9.25L2.81 8.55H5.62L4.22 7.14L7.78 3.58C12 3.58L9.89 5.74L11.3 7.14L10.59 7.85L12.38 9.63L14.2 7.75C17.5 10.1 17.5 10.1Z',
    };

    const palette = theme === 'dark'
      ? {
          solar: '#f5a524',
          battery: '#3ecf8e',
          grid: dir === 'b' ? '#9b87f5' : '#5b9fd4',
          load: '#4ecdc4',
          inv: '#9aa3b2',
          text: '#e8eaed',
          textMuted: '#8b939e',
          surface: dir === 'a' ? 'rgba(255,255,255,0.05)' : 'transparent',
          surfaceHi: dir === 'a' ? 'rgba(255,255,255,0.09)' : 'transparent',
          ring: dir === 'a' ? 0.45 : 0.35,
        }
      : {
          solar: '#d48806',
          battery: '#16a34a',
          grid: dir === 'b' ? '#7c5cff' : '#3b82c4',
          load: '#0d9488',
          inv: '#64748b',
          text: '#14181f',
          textMuted: '#64748b',
          surface: dir === 'a' ? 'rgba(255,255,255,0.85)' : 'transparent',
          surfaceHi: dir === 'a' ? '#ffffff' : 'transparent',
          ring: dir === 'a' ? 0.35 : 0.4,
        };

    const LOADS = [
      { id: 1, x: 645, y: 88, w: 350, icon: 'ev', name: 'EV charger' },
      { id: 2, x: 725, y: 88, w: 400, icon: 'hw', name: 'Hot water' },
      { id: 5, x: 805, y: 88, w: 550, icon: 'pool', name: 'Pool' },
      { id: 7, x: 885, y: 88, w: 650, icon: 'garage', name: 'Garage' },
      { id: 3, x: 645, y: 248, w: 450, icon: 'kitchen', name: 'Kitchen' },
      { id: 4, x: 725, y: 248, w: 500, icon: 'office', name: 'Office' },
      { id: 6, x: 805, y: 248, w: 600, icon: 'shed', name: 'Shed' },
      { id: 8, x: 885, y: 248, w: 700, icon: 'shop', name: 'Workshop' },
    ];

    const BUS_X = 572;
    const HUB = { x: 392, y: 248 };
    const SOC = 0.75;

    function iconPath(key, x, y, size, color, outline) {
      const scale = size / 24;
      const d = ICONS[key];
      if (outline) {
        return `<g transform="translate(${x},${y}) scale(${scale})"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>`;
      }
      return `<g transform="translate(${x},${y}) scale(${scale})"><path d="${d}" fill="${color}"/></g>`;
    }

    function ringNode(cx, cy, r, color, iconKey, id) {
      const outline = dir === 'b';
      const fill = dir === 'a' ? palette.surfaceHi : 'none';
      const stroke = color;
      const sw = dir === 'a' ? 2 : 1.5;
      const iconSize = 22;
      const ix = cx - iconSize / 2;
      const iy = cy - iconSize / 2 - 1;
      const glow = dir === 'a'
        ? `<circle class="node-ring-outer" cx="${cx}" cy="${cy}" r="${r + 4}" fill="none" stroke="${stroke}" stroke-width="1" stroke-opacity="${palette.ring * 0.5}"/>`
        : '';
      return `<g id="${id}">
        ${glow}
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-opacity="${palette.ring}"/>
        ${iconPath(iconKey, ix, iy, iconSize, stroke, outline)}
      </g>`;
    }

    function valuePill(x, y, value, unit, label, accent) {
      const fill = dir === 'a' ? palette.surface : 'none';
      const stroke = dir === 'b' ? accent : 'none';
      const sw = dir === 'b' ? 1 : 0;
      const h = 28;
      const w = Math.max(56, value.length * 7 + 24);
      return `<g transform="translate(${x - w / 2},${y})">
        <rect width="${w}" height="${h}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-opacity="0.25"/>
        <text x="${w / 2}" y="12" text-anchor="middle" class="value tabular" fill="${palette.text}" font-size="12" font-weight="600">${value}<tspan class="muted" font-size="9" font-weight="500"> ${unit}</tspan></text>
        ${label ? `<text x="${w / 2}" y="24" text-anchor="middle" class="label" fill="${palette.textMuted}">${label}</text>` : ''}
      </g>`;
    }

    function loadBubble(l) {
      const cx = l.x;
      const cy = l.y;
      const r = 30;
      const outline = dir === 'b';
      const fill = dir === 'a' ? palette.surfaceHi : 'none';
      const stroke = palette.load;
      const iconR = 18;
      const ix = cx - iconR / 2;
      const iy = cy - iconR / 2;
      return `<g id="load-${l.id}">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${dir === 'a' ? 2 : 1.25}" stroke-opacity="${palette.ring}"/>
        ${iconPath(l.icon, ix, iy, iconR, stroke, outline)}
        <text x="${cx}" y="${cy + r + 16}" text-anchor="middle" class="value tabular" fill="${palette.text}" font-size="11">${l.w}</text>
        <text x="${cx}" y="${cy + r + 30}" text-anchor="middle" class="label" fill="${palette.textMuted}">${l.name}</text>
      </g>`;
    }

    function flowPath(d, color, id, dur = '2.4s') {
      const track = `<path class="flow-track" d="${d}" stroke="${color}"/>`;
      const active = `<path class="flow-active" id="${id}" d="${d}" stroke="${color}"/>`;
      const dotR = dir === 'a' ? 4 : 3;
      const dot = `<circle class="dot-glow" r="${dotR}" fill="${color}">
        <animateMotion dur="${dur}" repeatCount="indefinite" rotate="auto">
          <mpath href="#${id}"/>
        </animateMotion>
      </circle>`;
      return track + active + dot;
    }

    const ys = LOADS.map((l) => l.y);
    const trunkTop = Math.min(...ys);
    const trunkBot = Math.max(...ys);

    const flows = LOADS.map((l, i) => {
      const cy = l.y;
      const d = `M ${HUB.x + 32} ${HUB.y} L ${BUS_X} ${HUB.y} L ${BUS_X} ${cy} Q ${l.x - 40} ${cy} ${l.x - 32} ${cy}`;
      const dur = `${1.6 + (l.w / 800)}s`;
      return flowPath(d, palette.load, `flow-${l.id}`, dur);
    }).join('');

    const trunk = `<path class="flow-track" d="M ${HUB.x} ${HUB.y} L ${BUS_X} ${HUB.y} L ${BUS_X} ${trunkTop} L ${BUS_X} ${trunkBot}" stroke="${palette.load}"/>
      <path class="flow-active" id="flow-trunk" d="M ${HUB.x} ${HUB.y} L ${BUS_X} ${HUB.y} L ${BUS_X} ${trunkTop} L ${BUS_X} ${trunkBot}" stroke="${palette.load}"/>
      <circle class="dot-glow" r="4" fill="${palette.load}"><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#flow-trunk"/></animateMotion></circle>`;

    const pvFlows = `
      ${flowPath(`M 300 128 L 392 200 L ${HUB.x} ${HUB.y}`, palette.solar, 'flow-pv1', '2.2s')}
      ${flowPath(`M 420 128 L 392 200 L ${HUB.x} ${HUB.y}`, palette.solar, 'flow-pv2', '2.5s')}
      ${flowPath(`M ${HUB.x} ${HUB.y} L 140 ${HUB.y}`, palette.grid, 'flow-grid', '3s')}
      ${flowPath(`M ${HUB.x} ${HUB.y + 40} L ${HUB.x} 392`, palette.battery, 'flow-bat', '2.8s')}
    `;

    const socR = 38;
    const circ = 2 * Math.PI * socR;
    const dash = circ * SOC;
    const gap = circ - dash;

    const battRing = `<g transform="translate(${HUB.x},392)">
      <circle r="${socR + 8}" fill="${palette.surface}" stroke="none"/>
      <circle r="${socR + 6}" fill="none" stroke="${palette.battery}" stroke-width="2" stroke-opacity="0.2"/>
      <circle r="${socR}" fill="none" stroke="${palette.battery}" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="${dash} ${gap}" transform="rotate(-90)"/>
      <text text-anchor="middle" y="-2" class="value tabular" fill="${palette.text}" font-size="14" font-weight="700">${Math.round(SOC*100)}%</text>
      <text text-anchor="middle" y="14" class="label" fill="${palette.textMuted}">Battery</text>
      <text text-anchor="middle" y="52" class="value tabular" fill="${palette.battery}" font-size="11">−500 W</text>
    </g>`;

    const svg = `
      <defs>
        <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2.5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- PV -->
      ${ringNode(300, 88, 34, palette.solar, 'solar', 'node-pv1')}
      ${valuePill(300, 130, '2.00', 'kW', 'PV 1', palette.solar)}
      ${ringNode(420, 88, 34, palette.solar, 'solar', 'node-pv2')}
      ${valuePill(420, 130, '1.50', 'kW', 'PV 2', palette.solar)}
      ${valuePill(360, 168, '3.50', 'kW', 'Solar total', palette.solar)}

      <!-- Grid left -->
      ${ringNode(108, 248, 36, palette.grid, 'grid', 'node-grid')}
      ${valuePill(108, 296, '100', 'W', 'Grid import', palette.grid)}
      <text x="108" y="318" text-anchor="middle" class="label" fill="${palette.textMuted}">Autarky 70%</text>

      <!-- Inverter centre -->
      ${ringNode(HUB.x, HUB.y, 40, palette.inv, 'inv', 'node-inv')}
      ${valuePill(HUB.x, HUB.y + 58, '4.50', 'kW', 'Inverter', palette.inv)}

      <!-- Home hub + loads -->
      ${ringNode(532, 248, 28, palette.load, 'home', 'node-home')}
      ${trunk}
      ${flows}
      ${LOADS.map(loadBubble).join('')}

      <!-- Battery bottom -->
      ${battRing}

      <!-- Bottom-right: non-essential + grid meter -->
      ${ringNode(780, 420, 32, palette.grid, 'homeOut', 'node-noness')}
      ${valuePill(780, 462, '−100', 'W', 'Non-essential', palette.grid)}
      ${ringNode(870, 420, 32, palette.grid, 'grid', 'node-grid2')}
      ${valuePill(870, 462, '0', 'W', 'Grid CT', palette.grid)}

      ${pvFlows}
    `;

    document.getElementById('diagram').innerHTML = svg;
    document.getElementById('diagram').style.color = palette.text;
  </script>
</body>
</html>
